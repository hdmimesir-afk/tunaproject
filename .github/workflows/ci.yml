name: CI

on:
  pull_request:
  push:
    branches: [main, "fase-*"]

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, tes, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Migrasi dan tes database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase db start
      - name: Tes database (pgTAP)
        run: |
          set +e
          supabase test db > /tmp/pgtap.log 2>&1
          kode=$?
          cat /tmp/pgtap.log
          if [ $kode -ne 0 ]; then
            grep -E "not ok|Failed|ERROR|Parse error|#" /tmp/pgtap.log | head -30 | while IFS= read -r baris; do echo "::error::${baris}"; done
          fi
          exit $kode

  e2e:
    name: Tes klik-klik (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - name: Jalankan Supabase lokal (ulangi bila gagal mengunduh image)
        run: |
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,inbucket && exit 0
            echo "::warning::supabase start gagal (percobaan $i)"; supabase stop --no-backup || true; sleep 10
          done
          exit 1
      - name: Ambil kunci Supabase lokal
        run: |
          supabase status -o env > /tmp/sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' /tmp/sb.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: laporan-playwright
          path: |
            playwright-report/
            test-results/
